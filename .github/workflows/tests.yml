name: DebtLoop bot tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m py_compile main.py netting.py test_netting.py
      - name: Run netting tests
        run: python -m unittest -v test_netting.py
